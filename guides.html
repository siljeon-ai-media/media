<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>실전 AI 가이드 목록</title><meta name="description" content="실전 AI(siljeon.ai)가 직접 쓰고 쓰는 방식을 정리한 실전 가이드 모음."><link rel="canonical" href="https://siljeon-ai-media.github.io/media/guides.html"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><style>
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light}
body{background:#F7F6F2;color:#1C1F1D;font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.7;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:40px 22px 72px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:44px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:#1C1F1D;text-decoration:none;letter-spacing:-.2px}
.logo{width:30px;height:28px;border-radius:7px;background:#1C1F1D;color:#fff;font-weight:800;font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.logo i{display:inline-block;width:3px;height:11px;background:#5FBF8F;margin-left:2px;border-radius:1px}
.top .ig{color:#667069;font-size:14px;text-decoration:none}
.eyebrow{font-size:13px;color:#2F7A57;font-weight:600;letter-spacing:.02em;margin-bottom:12px}
h1{font-size:28px;line-height:1.38;font-weight:700;letter-spacing:-.6px;word-break:keep-all;text-wrap:balance;margin-bottom:16px}
.lead{font-size:16px;line-height:1.8;color:#4F5852;word-break:keep-all;margin-bottom:32px}
.box{background:#fff;border:1px solid #E6E3DA;border-radius:16px;padding:24px 22px 22px;box-shadow:0 1px 2px rgba(28,31,29,.04)}
.box-label{font-size:13px;color:#667069;margin-bottom:12px;font-weight:600}
.box pre{white-space:pre-wrap;word-break:keep-all;font-family:inherit;font-size:15.5px;line-height:1.85;color:#1C1F1D}
.copy{display:block;width:100%;margin-top:22px;padding:15px;border:0;border-radius:12px;background:#1F5C42;color:#fff;font-weight:600;font-size:16px;cursor:pointer;letter-spacing:-.2px;font-family:inherit}
.copy:hover{background:#184B36}
.copy.done{background:#E8EFEA;color:#1F5C42}
.sec{margin-top:36px}
.sec h2{font-size:13px;font-weight:600;color:#667069;margin-bottom:8px;letter-spacing:.02em}
.sec p{font-size:15.5px;line-height:1.85;color:#2B312D;word-break:keep-all}
.sec a{color:#1F5C42;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.follow{display:block;margin-top:36px;padding:14px;border-radius:12px;border:1px solid #D5D2C8;color:#1C1F1D;text-align:center;text-decoration:none;font-weight:600;font-size:15px;background:#fff}
.list{display:flex;flex-direction:column;margin-top:8px;border-top:1px solid #E6E3DA}
.card{display:flex;align-items:center;gap:18px;padding:20px 4px;border-bottom:1px solid #E6E3DA;text-decoration:none;color:inherit}
.card:hover .t{color:#1F5C42}
.card .n{flex:0 0 30px;font-size:15px;font-weight:600;color:#9AA29D;font-variant-numeric:tabular-nums}
.card .b{flex:1;min-width:0}
.card .k{font-size:12.5px;color:#2F7A57;font-weight:600;margin-bottom:4px}
.card .t{font-size:16.5px;font-weight:600;line-height:1.5;word-break:keep-all;letter-spacing:-.3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .ar{color:#B5BBB6;font-size:20px}
.card.pin{background:#fff;border:1px solid #E6E3DA;border-radius:14px;padding:20px;margin-bottom:28px}
.more{margin-top:56px}
.more h2{font-size:13px;color:#667069;font-weight:600;margin-bottom:6px}
.cohort{margin-top:56px;padding:26px 24px;border-radius:16px;background:#fff;border:1px solid #E6E3DA}
.cohort .k{font-size:13px;color:#2F7A57;font-weight:600;margin-bottom:8px}
.cohort .t{font-size:18px;font-weight:700;line-height:1.5;word-break:keep-all;letter-spacing:-.3px}
.cohort .d{font-size:14.5px;color:#667069;margin-top:8px;line-height:1.7;word-break:keep-all}
.cohort .nx{margin-top:14px;font-size:13.5px;color:#667069;line-height:1.7;word-break:keep-all}
.cohort .nx a{display:inline;margin:0;padding:0;background:none;color:#1F5C42;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.cohort>a{display:inline-block;margin-top:16px;padding:12px 20px;border-radius:10px;background:#1C1F1D;color:#fff;text-decoration:none;font-weight:600;font-size:15px}
.foot{margin-top:48px;padding-top:20px;border-top:1px solid #E6E3DA;font-size:13px;color:#8A928D;line-height:1.7;word-break:keep-all}
.foot a{color:#667069}
@media(max-width:480px){.wrap{padding:28px 18px 56px}h1{font-size:24px}.top{margin-bottom:32px}}
.art h1{font-size:26px}.art h2{font-size:19px;font-weight:700;margin:36px 0 10px;letter-spacing:-.3px;color:#1C1F1D;word-break:keep-all}.art p,.art li{font-size:15.5px;line-height:1.85;color:#2B312D;word-break:keep-all;margin-bottom:10px}.art ul,.art ol{padding-left:22px;margin-bottom:12px}.art pre{background:#fff;border:1px solid #E6E3DA;border-radius:12px;padding:16px 18px;white-space:pre-wrap;font-family:inherit;font-size:14.5px;line-height:1.8;margin:10px 0 14px}.art code{background:#EFEDE6;padding:1px 6px;border-radius:5px;font-size:14px}.art pre code{background:none;padding:0}.art table{border-collapse:collapse;width:100%;font-size:14px;margin:12px 0;display:block;overflow-x:auto}.art th,.art td{border:1px solid #E6E3DA;padding:8px 10px;text-align:left;vertical-align:top;background:#fff}.art blockquote{border-left:3px solid #5FBF8F;padding:2px 14px;color:#4F5852;margin:12px 0}.art hr{border:0;border-top:1px solid #E6E3DA;margin:28px 0}.art a{color:#1F5C42;font-weight:600}</style></head><body><div class="wrap"><div class="top"><a class="brand" href="prompts.html"><span class="logo">실전<i></i></span>실전 AI</a></div><h1>실전 AI 가이드</h1><p class="lead">직접 운영하며 정리한 방법 글 모음입니다. 이 글들은 AI가 작성했습니다.</p><div class="list"><a class="card" href="guide-claude-md.html"><span class="n">1</span><span class="b"><span class="t">클로드 코드 CLAUDE.md, 실제로 사업을 맡기는 사람은 이렇게 씁니다 (실전 작성 예시)</span></span><span class="ar">›</span></a><a class="card" href="guide-wp-hide-elements.html"><span class="n">2</span><span class="b"><span class="t">워드프레스에서 글 제목·대표이미지·작성자·날짜 숨기기 — 테마 옵션 vs CSS vs 플러그인 비교</span></span><span class="ar">›</span></a></div></div></body></html>
